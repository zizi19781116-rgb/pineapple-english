name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Xcode Project
        id: project
        shell: bash
        run: |
          PROJECT=$(find . -name "*.xcodeproj" | head -1)

          if [ -z "$PROJECT" ]; then
            echo "❌ 没有找到 xcodeproj"
            exit 1
          fi

          echo "✅ 找到工程: $PROJECT"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Show Xcode Version
        run: |
          xcodebuild -version
          swift --version

      - name: Show Project Info
        run: |
          xcodebuild \
            -list \
            -project "${{ steps.project.outputs.project }}"

      - name: Build iOS App
        shell: bash
        run: |
          set -o pipefail

          xcodebuild \
            -project "${{ steps.project.outputs.project }}" \
            -scheme "菠萝单词" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            | tee build.log

      - name: Find Built App
        shell: bash
        run: |
          echo "正在查找编译结果..."

          find "$PWD/build" -type d -name "*.app" -print || true

      - name: Create IPA
        shell: bash
        run: |
          APP=$(find "$PWD/build/Build/Products" \
            -type d \
            -name "*.app" \
            ! -name "*Tests*" \
            ! -name "*UITests*" \
            | head -1)

          if [ -z "$APP" ]; then
            echo "❌ 没有找到编译后的 .app"
            echo "下面是 Build/Products 的内容："
            find "$PWD/build/Build/Products" -maxdepth 5 -print || true
            exit 1
          fi

          echo "✅ 找到 App:"
          echo "$APP"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" Payload/

          /usr/bin/zip \
            -r \
            PineappleWords-unsigned.ipa \
            Payload

          echo "✅ IPA 创建成功"
          ls -lh PineappleWords-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PineappleWords-IPA
          path: PineappleWords-unsigned.ipa

      - name: Upload Build Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: build.log
          if-no-files-found: ignore
